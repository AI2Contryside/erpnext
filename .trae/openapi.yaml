components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    # Auth
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          default: Bearer
        user:
          $ref: '#/components/schemas/User'

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string

    # Tenant
    Tenant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string
        package_level:
          type: string
          enum: [basic, pro, enterprise]
        package_expire_at:
          type: string
          format: date-time
        llm_query_qpm:
          type: integer
        status:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantCreateRequest:
      type: object
      required:
        - name
        - contact_phone
      properties:
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string

    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string

    TenantListResponse:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    TenantConfig:
      type: object
      properties:
        reply_style:
          type: string
        work_hours:
          type: object
        languages:
          type: array
          items:
            type: string
        sensitive_words:
          type: array
          items:
            type: string

    TenantConfigUpdateRequest:
      type: object
      properties:
        reply_style:
          type: string
        work_hours:
          type: object
        languages:
          type: array
          items:
            type: string
        sensitive_words:
          type: array
          items:
            type: string

    # User
    User:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        username:
          type: string
        real_name:
          type: string
        phone:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, employee, customer]
        avatar:
          type: string
        status:
          type: integer
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required:
        - username
        - password
        - phone
        - tenant_id
      properties:
        username:
          type: string
        password:
          type: string
        phone:
          type: string
        email:
          type: string
        real_name:
          type: string
        role:
