openapi: 3.0.3
info:
  title: TradeMind API
  description: 外贸ERP智能助手系统 API规范
  version: 1.0.0
  contact:
    name: TradeMind Team

servers:
  - url: https://api.trademind.io/v1
    description: 生产环境 v1
  - url: https://api.trademind.io/v2
    description: 生产环境 v2 (预留)
  - url: http://localhost:8080/v1
    description: 开发环境

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Auth
    description: 认证授权
  - name: Tenant
    description: 租户管理
  - name: User
    description: 用户管理
  - name: Session
    description: 会话管理
  - name: Agent
    description: Agent服务
  - name: File
    description: 文件管理
  - name: ERP
    description: ERP集成
  - name: Token
    description: Token消耗
  - name: Subscription
    description: 订阅管理
  - name: Admin
    description: 后台管理

paths:
  # ==================== 认证授权 ====================
  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login_id
                - password
              properties:
                login_id:
                  type: string
                  description: 登录ID (手机号/邮箱/用户名)
                password:
                  type: string
                  description: 密码
                tenant_id:
                  type: integer
                  description: 租户ID (可选)
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 用户名或密码错误
        '403':
          description: 账号已被禁用

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 用户登出
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 登出成功

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 刷新Token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: 刷新Token
      responses:
        '200':
          description: Token刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/register:
    post:
      tags:
        - Auth
      summary: 用户注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - phone
                - tenant_id
              properties:
                username:
                  type: string
                password:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                real_name:
                  type: string
                tenant_id:
                  type: integer
      responses:
        '201':
          description: 注册成功

  /auth/change-password:
    post:
      tags:
        - Auth
      summary: 修改密码
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: 密码修改成功

  # ==================== 租户管理 ====================
  /tenants:
    get:
      tags:
        - Tenant
      summary: 获取租户列表 (管理员)
      operationId: listTenants
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: integer
            description: 状态 0=禁用 1=正常 2=试用
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'

    post:
      tags:
        - Tenant
      summary: 创建租户
      operationId: createTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /tenants/{id}:
    get:
      tags:
        - Tenant
      summary: 获取租户详情
      operationId: getTenant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

    put:
      tags:
        - Tenant
      summary: 更新租户信息
      operationId: updateTenant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

    delete:
      tags:
        - Tenant
      summary: 删除租户
      operationId: deleteTenant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 删除成功

  /tenants/{id}/config:
    get:
      tags:
        - Tenant
      summary: 获取租户配置
      operationId: getTenantConfig
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfig'

    put:
      tags:
        - Tenant
      summary: 更新租户配置
      operationId: updateTenantConfig
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigUpdateRequest'
      responses:
        '200':
          description: 更新成功

  /tenants/{id}/package:
    put:
      tags:
        - Tenant
      summary: 更新租户套餐
      operationId: updateTenantPackage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - package_level
                - duration
              properties:
                package_level:
                  type: string
                  enum: [basic, pro, enterprise]
                duration:
                  type: integer
                  description: 订阅时长(单位月)
      responses:
        '200':
          description: 套餐更新成功

  # ==================== 用户管理 ====================
  /users:
    get:
      tags:
        - User
      summary: 获取用户列表
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

    post:
      tags:
        - User
      summary: 创建用户
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags:
        - User
      summary: 获取用户详情
      operationId: getUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      tags:
        - User
      summary: 更新用户信息
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 更新成功

    delete:
      tags:
        - User
      summary: 删除用户
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 删除成功

  /users/{id}/role:
    put:
      tags:
        - User
      summary: 更新用户角色
      operationId: updateUserRole
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [admin, manager, employee, customer]
      responses:
        '200':
          description: 角色更新成功

  /users/me:
    get:
      tags:
        - User
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/profile:
    put:
      tags:
        - User
      summary: 更新当前用户信息
      operationId: updateCurrentUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                real_name:
                  type: string
                email:
                  type: string
                avatar:
                  type: string
      responses:
        '200':
          description: 更新成功

  # ==================== 会话管理 ====================
  /sessions:
    get:
      tags:
        - Session
      summary: 获取会话列表
      operationId: listSessions
      security:
        - BearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: integer
        - name: user_id
          in: query
          schema:
            type: integer
        - name: customer_id
          in: query
          schema:
            type: integer
        - name: channel
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'

    post:
      tags:
        - Session
      summary: 创建会话
      operationId: createSession
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
              properties:
                channel:
                  type: string
                  enum: [pc, app, feishu, whatsapp, web]
                title:
                  type: string
                customer_id:
                  type: integer
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /sessions/{id}:
    get:
      tags:
        - Session
      summary: 获取会话详情
      operationId: getSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

    delete:
      tags:
        - Session
      summary: 结束会话
      operationId: endSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 会话已结束

  /sessions/{id}/messages:
    get:
      tags:
        - Session
      summary: 获取会话消息历史
      operationId: getSessionMessages
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'

  # ==================== Agent服务 ====================
  /agent/chat:
    post:
      tags:
        - Agent
      summary: 发送聊天消息
      operationId: chat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - message
              properties:
                session_id:
                  type: integer
                  description: 会话ID
                message:
                  type: string
                  description: 消息内容
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [image, file]
                      url:
                        type: string
      responses:
        '200':
          description: 消息处理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  /agent/chat/stream:
    post:
      tags:
        - Agent
      summary: 流式聊天 (SSE)
      operationId: chatStream
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - message
              properties:
                session_id:
                  type: integer
                message:
                  type: string
      responses:
        '200':
          description: 流式响应
          content:
            text/event-stream:
              schema:
                type: string

  /agent/import:
    post:
      tags:
        - Agent
      summary: 数据导入 (文件/自然语言)
      operationId: importData
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [file, natural_language]
                  description: 导入类型
                file_id:
                  type: string
                  description: 文件ID (type=file时必填)
                content:
                  type: string
                  description: 自然语言描述 (type=natural_language时必填)
                target_doctype:
                  type: string
                  description: 目标ERP DocType
                dry_run:
                  type: boolean
                  default: false
                  description: 是否试运行
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'

  /agent/query:
    post:
      tags:
        - Agent
      summary: 自然语言数据查询
      operationId: queryData
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: 自然语言查询
                target_doctype:
                  type: string
                  description: 目标DocType
                generate_chart:
                  type: boolean
                  default: false
                  description: 是否生成图表
                export_format:
                  type: string
                  enum: [none, xlsx, csv, pdf]
                  default: none
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'

  /agent/tasks:
    get:
      tags:
        - Agent
      summary: 获取任务列表
      operationId: listTasks
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'

  /agent/tasks/{id}:
    get:
      tags:
        - Agent
      summary: 获取任务详情
      operationId: getTask
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /agent/tasks/{id}/cancel:
    post:
      tags:
        - Agent
      summary: 取消任务
      operationId: cancelTask
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务已取消

  /agent/tools:
    get:
      tags:
        - Agent
      summary: 获取可用工具列表
      operationId: listTools
      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: enabled_only
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'

  /agent/tools/{name}/execute:
    post:
      tags:
        - Agent
      summary: 执行工具
      operationId: executeTool
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 执行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecutionResponse'

  # ==================== 文件管理 ====================
  /files/upload:
    post:
      tags:
        - File
      summary: 文件上传
      operationId: uploadFile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  enum: [document, image, audio, other]
                  default: other
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'

  /files/{id}:
    get:
      tags:
        - File
      summary: 获取文件信息
      operationId: getFile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'

    delete:
      tags:
        - File
      summary: 删除文件
      operationId: deleteFile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功

  /files/{id}/download:
    get:
      tags:
        - File
      summary: 下载文件
      operationId: downloadFile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件下载
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /files/{id}/parse:
    post:
      tags:
        - File
      summary: 解析文件
      operationId: parseFile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parse_type:
                  type: string
                  enum: [auto, excel, csv, pdf, image]
                  default: auto
                target_structure:
                  type: object
                  description: 期望的目标结构
      responses:
        '200':
          description: 解析成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'

  /files:
    get:
      tags:
        - File
      summary: 获取文件列表
      operationId: listFiles
      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'

  # ==================== ERP集成 ====================
  /erp/item:
    get:
      tags:
        - ERP
      summary: 查询商品
      operationId: queryItems
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
