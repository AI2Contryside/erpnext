; ERPNext supervisor config — runs the four-process group as a single
; container's PID 1 supplied by entrypoint.sh in role=all.
;
; All program stdout/stderr is forwarded to the supervisord parent, which
; entrypoint.sh launched with `-n` (foreground), so logs flow directly to
; `docker logs <container>` with no rotation files inside the image.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisor/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── web ─────────────────────────────────────────────────────────────────────
; gunicorn from the bench-managed venv. Worker count comes from the
; GUNICORN_WORKERS env var (entrypoint baked it into common_site_config,
; supervisor reads it again here to set the gunicorn flag).
[program:web]
command=/home/frappe/frappe-bench/env/bin/gunicorn
    --bind 0.0.0.0:8000
    --workers %(ENV_GUNICORN_WORKERS)s
    --timeout 120
    --access-logfile -
    --error-logfile -
    frappe.app:application
directory=/home/frappe/frappe-bench/sites
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
stopwaitsecs=30

; ── scheduler ───────────────────────────────────────────────────────────────
[program:scheduler]
command=/home/frappe/.local/bin/bench schedule
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; ── workers ─────────────────────────────────────────────────────────────────
; Frappe's RQ has three queues (default/short/long). One worker per queue
; keeps long jobs from blocking quick tasks. Bump worker counts via a
; supervisorctl reload if you need more parallelism on a single VM.
[program:worker-default]
command=/home/frappe/.local/bin/bench worker --queue default
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:worker-short]
command=/home/frappe/.local/bin/bench worker --queue short
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:worker-long]
command=/home/frappe/.local/bin/bench worker --queue long
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; ── socketio ────────────────────────────────────────────────────────────────
; Node-based realtime server. Reads redis_socketio from common_site_config.
[program:socketio]
command=/usr/bin/node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

[group:erpnext]
programs=web,scheduler,worker-default,worker-short,worker-long,socketio
