# Frappe / ERPNext nginx fronting layer.
#
# Mounted into the nginx:alpine sidecar at /etc/nginx/conf.d/erpnext.conf.
# Listens on port 80 inside the container; the compose maps host ${PORT}
# (default 80) → 80.
#
# Layout:
#   /assets/     → static JS/CSS bundles built by `bench build` (read from
#                  shared volume; no proxy hop, ~40x faster than letting
#                  gunicorn serve them).
#   /files/      → public Files DocType uploads (auth-free).
#   /private/    → blocked at the edge so private/files/ can never be
#                  served by accident; frappe re-routes legitimate
#                  private downloads through /api/method/frappe.utils...
#                  which goes via gunicorn.
#   /socket.io/  → upgrade to websocket, proxy to socketio:9000.
#   /            → everything else proxies to gunicorn:8000.

upstream erpnext_web {
    server erpnext:8000;
    keepalive 32;
}

upstream erpnext_socketio {
    server erpnext:9000;
}

server {
    listen 80;
    server_name _;

    # Frappe sometimes generates large attachments / docling extracts;
    # keep the inflight body cap generous.
    client_max_body_size 50m;
    client_body_timeout 180s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # ── Static asset bundles ────────────────────────────────────────────────
    location /assets {
        alias /home/frappe/frappe-bench/sites/assets;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Public Files DocType uploads ────────────────────────────────────────
    location /files {
        # `bench` configures sites with a default site → directory mapping.
        # When serve_default_site=true (we set it in entrypoint.sh) the
        # default site's files live at sites/${SITE_NAME}/public/files/.
        # nginx can't read SITE_NAME from env easily; instead, frappe
        # serves these via /api/method endpoints which proxy through
        # gunicorn. Forward unmatched /files to gunicorn so frappe's
        # site-resolution kicks in.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://erpnext_web;
    }

    # ── Hard-block private files at the edge ────────────────────────────────
    location /private {
        return 403;
    }

    # ── Realtime / socketio ─────────────────────────────────────────────────
    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://erpnext_socketio;
    }

    # ── Everything else → gunicorn ──────────────────────────────────────────
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_pass http://erpnext_web;
    }
}
